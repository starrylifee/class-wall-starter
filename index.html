<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 반 담벼락</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📌</text></svg>">
  <style>
    body { font-family: sans-serif; margin: 20px; }
    h1 { font-size: 24px; }
    .notice { background: #ffe9e9; padding: 10px; }

    /* 로그인 버튼이 들어올 자리 */
    #userArea { margin: 10px 0; color: #666; }

    /* 메모 쓰는 칸 */
    #writer { margin: 16px 0; }
    #writer textarea { width: 400px; font-size: 16px; }

    /* 메모가 붙는 담벼락 */
    #wall { display: flex; flex-wrap: wrap; gap: 10px; }
    .memo { border: 1px solid #ddd; background: #fffde7; padding: 10px; width: 220px; font-size: 15px; position: relative; }
    .memo .del-btn { float: right; border: none; background: transparent; cursor: pointer; font-size: 16px; color: #999; }
    .memo .del-btn:hover { color: #f44336; }
    .memo .ai-btn { margin-top: 8px; font-size: 12px; padding: 3px 8px; border: 1px solid #c8e6c9; background: #e8f5e9; color: #2e7d32; border-radius: 4px; cursor: pointer; display: block; }
    .memo .ai-btn:hover { background: #c8e6c9; }
    .memo .ai-comment-box { margin-top: 8px; padding: 8px; background: #f1f8e9; border-left: 3px solid #66bb6a; border-radius: 4px; font-size: 13px; color: #2e7d32; line-height: 1.4; }
  </style>
</head>
<body>

  <h1>우리 반 담벼락</h1>



  <!-- 로그인 버튼과 사용자 이름이 표시되는 영역 -->
  <div id="userArea">로그인 상태 확인 중...</div>

  <div id="writer">
    <textarea id="input" rows="3" placeholder="메모를 쓰고 엔터"></textarea>
  </div>

  <!-- 메모는 app.js가 그립니다 -->
  <div id="wall"></div>

  <!--
    type="module" 로 불러옵니다.
    Firebase SDK가 import 문법이라, 백엔드 시간에 이 방식이어야 붙일 수 있습니다.
  -->
  <script type="module" src="app.js"></script>
</body>
</html>
